name: Build ARM64 Kernel Module

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu make
    - name: Download Kernel Headers
      run: |
        # Minimal headers package ya clean clone alternative
        git clone --depth=1 https://github.com/akhilnarang/kernel_workspace.git -b android-10 kernel_src || true
    - name: Build Module
      run: |
        if [ -d "kernel_src" ]; then
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel_src M=$(pwd)
        else
          echo "Kernel source directory not found!"
          exit 1
        fi
        
