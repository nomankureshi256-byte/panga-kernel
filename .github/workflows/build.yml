name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make linux-headers-generic
          make -C /lib/modules/$(uname -r)/build M=$(pwd) modules
          ls -la
      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panga-kernel-module
          path: '*.ko'
          
