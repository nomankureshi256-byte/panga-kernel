name: Build Kernel Module

on: [push]

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential linux-headers-generic

    - name: Compile Module
      run: |
        make
        
