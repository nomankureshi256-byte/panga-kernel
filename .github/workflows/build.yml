name: Build APatch KPM Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libelf-dev bc bison flex libssl-dev

    - name: Compile Module
      run: |
        make -C /lib/modules/$(uname -r)/build M=$PWD modules

    - name: Create APatch Module Package
      run: |
        mkdir -p apatch_module/META-INF/com/google/android
        mkdir -p output
        
        # module.prop बनाना जो APatch ऐप में दिखे
        echo "id=panga_kpm" > apatch_module/module.prop
        echo "name=Panga KPM Module" >> apatch_module/module.prop
        echo "version=1.0" >> apatch_module/module.prop
        echo "versionCode=1" >> apatch_module/module.prop
        echo "author=Aamir Kureshi" >> apatch_module/module.prop
        echo "description=Kernel Patch Module for Panga" >> apatch_module/module.prop

        # .ko को .kpm में बदलकर फोल्डर में रखना
        find . -name "*.ko" -exec cp {} apatch_module/ \;
        cd apatch_module
        for f in *.ko; do mv "$f" "${f%.ko}.kpm"; done
        
        # ज़िप पैकेज बनाना
        zip -r ../output/panga-apatch-module.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: panga-apatch-module
        path: output/panga-apatch-module.zip
        
