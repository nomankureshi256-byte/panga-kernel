name: Build APatch KPM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libelf-dev bc bison flex libssl-dev

    - name: Compile Kernel Module
      run: |
        make -C /lib/modules/$(uname -r)/build M=$PWD modules

    - name: Package for APatch
      run: |
        mkdir -p package/META-INF/com/google/android
        mkdir -p output
        
        # आवश्यक module.prop बनाना
        echo "id=panga_kpm" > package/module.prop
        echo "name=Panga KPM" >> package/module.prop
        echo "version=1.0" >> package/module.prop
        echo "versionCode=1" >> package/module.prop
        echo "author=Panga" >> package/module.prop
        echo "description=Custom KPM for Realme 6 Pro" >> package/module.prop

        # .ko को .kpm में बदलना और पैकेज फोल्डर में डालना
        find . -name "*.ko" -exec cp {} package/ \;
        cd package
        for f in *.ko; do mv "$f" "${f%.ko}.kpm"; done
        
        # अंत में सही APatch ज़िप तैयार करना
        zip -r ../output/panga-fixed-module.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: panga-fixed-module
        path: output/panga-fixed-module.zip
        
