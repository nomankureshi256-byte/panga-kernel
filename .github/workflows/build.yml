name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Build
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev
        
        # Android 4.14 stable source clone karte hain jo Realme 6 Pro se match kare
        git clone --depth=1 https://android.googlesource.com/kernel/common -b android-4.14 kernel_src
        
        cd kernel_src
        make ARCH=arm64 defconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
        cd ..
        
        # Module build command
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel_src M=$(pwd)
        ls -la *.ko
        
