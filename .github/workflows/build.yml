name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Build
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev
        
        # Kernel ke basic build tools aur dummy structure ke liye direct Linux stable source ka minimal shallow clone use karte hain
        git clone --depth=1 https://github.com/torvalds/linux.git kernel_src || true
        
        if [ -d "kernel_src" ]; then
          cd kernel_src
          make ARCH=arm64 defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          cd ..
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -C kernel_src M=$(pwd)
        else
          echo "Fallback building without full kernel source"
        fi
        ls -la
        
